<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7e8ed"><title>Seguimiento de pedido | ROLITAS Creative Studio"><style>
:root{--rose:#b77991;--rose2:#f5dfe7;--ink:#684653;--muted:#987d87;--line:#eedce3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff9fb,#fbf2f5 55%,#fff7f8);font-family:system-ui,sans-serif;color:var(--ink);padding:22px}main{max-width:620px;margin:35px auto;background:#ffffffed;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 35px #8e5b7012}header{text-align:center}.brand{font:42px Georgia,serif;letter-spacing:5px;color:#9b6279;margin:0}h1{font:23px Georgia,serif}.muted{color:var(--muted);font-size:13px}.status{background:var(--rose2);border-radius:14px;padding:16px;text-align:center;margin:18px 0}.status strong{display:block;font-size:20px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:13px}.item span{display:block;font-size:11px;color:var(--muted)}.item b{display:block;margin-top:5px}.wide{grid-column:1/-1}button{background:var(--rose);color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}#msg{text-align:center;margin:20px 0}@media(max-width:420px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main><header><p class="brand">ROLITAS</p><p class="muted">CREATIVE STUDIO</p><h1>Seguimiento de tu pedido</h1><p class="muted">Consulta el avance de tu pedido de forma privada.</p></header><div id="msg">Consultando tu pedido...</div><section id="details" hidden><div class="status"><span>Estado del pedido</span><strong id="status"></strong></div><div class="grid"><div class="item"><span>Número de pedido</span><b id="number">—</b></div><div class="item"><span>Estado del pago</span><b id="payment">—</b></div><div class="item"><span>Total del pedido</span><b id="total">—</b></div><div class="item"><span>Abono registrado</span><b id="deposit">—</b></div><div class="item"><span>Saldo pendiente</span><b id="balance">—</b></div><div class="item"><span>Domicilio</span><b id="shipping">—</b></div><div class="item"><span>Tipo de entrega</span><b id="method">—</b></div><div class="item"><span>Fecha de entrega</span><b id="date">—</b></div><div class="item wide"><span>Última actualización</span><b id="updated">—</b></div></div><p class="muted" style="text-align:center;margin-top:18px">Los cambios aparecerán cuando ROLITAS actualice tu pedido.</p><p style="text-align:center"><button id="refresh" type="button">Actualizar estado</button></p></section></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL='https://dxjwoitunpuobwdwiqhk.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_By7y5SWfrsa0sMxfHuRLxA_D9hq1cgo';const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const token=new URLSearchParams(location.search).get("token");const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0);const date=v=>v?new Date(v+((/^\d{4}-\d{2}-\d{2}$/.test(v))?"T12:00:00":"")).toLocaleString("es-CO"):"Por definir";
async function load(){if(!token||token.length<32){$('msg').textContent="El enlace de seguimiento no es válido. Revisa que hayas abierto el enlace completo.";return}$('msg').textContent="Consultando tu pedido...";$('details').hidden=true;const {data,error}=await db.rpc("get_order_tracking",{p_token:token});if(error){console.error(error);$('msg').textContent="No pudimos consultar el pedido en este momento. Inténtalo nuevamente más tarde.";return}if(!data){$('msg').textContent="No encontramos un pedido asociado a este enlace.";return}$('msg').textContent="";$('details').hidden=false;$('status').textContent=data.order_status||"En revisión";$('number').textContent=data.order_number||"—";$('payment').textContent=data.payment_status||"Pendiente";$('total').textContent=money(data.total);$('deposit').textContent=money(data.deposit);$('balance').textContent=money(data.balance);$('shipping').textContent=money(data.shipping_cost);$('method').textContent=data.delivery_method||"Por definir";$('date').textContent=date(data.delivery_date);$('updated').textContent=date(data.updated_at||data.created_at)}
$('refresh').addEventListener('click',load);load();
</script></body></html>
